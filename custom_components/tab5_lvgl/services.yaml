publish_snapshot:
  name: Publish Snapshot
  description: Push all configured entity states (sensors, lights, switches, media players) to the Tab5 topics.
  fields:
    entry_id:
      description: Target Tab5 config entry (leave empty if only one exists).
      example: 1234567890abcdef
      selector:
        text:
          type: text

reload_assist_screens:
  name: Reload Assist screens
  description: Read the Assist screen files in <config>/hometiles/assist_screens now and send them to every panel (the Bridge also checks the folder every minute). Panels with screen file support list them after their built-in styles.
